<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сапёр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <div class="top-panel">
            <div class="counter" id="mines-counter">💣 10</div>
            <button class="reset-btn" id="reset-btn">🙂</button>
            <div class="counter" id="timer">⏱ 0</div>
        </div>
        <div class="hint">
            Стрелки — курсор · Пробел/Enter — открыть · Ctrl+Пробел/Enter — флажок · R — новая игра
        </div>
        <div class="board" id="board"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
